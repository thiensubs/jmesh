[package]
name = "jmesh"
version = "1.0.0"
authors = ["thiensubs <nguoitinh.cuaanh.12@gmail.com>"]
edition = "2021"
license = "MIT"
repository = "https://github.com/thiensubs/jmesh"
documentation = "https://docs.rs/jmesh"
homepage = "https://github.com/thiensubs/jmesh"
description = "A sqlite-utils inspired SQLite toolkit for Rust. Schema-less inserts, bulk operations, FTS, and multi-format import/export (JSON, CSV, Parquet, SQL)."
keywords = ["sqlite", "database", "json", "parquet", "csv", "cli"]
categories = ["database"]
readme = "README.md"
rust-version = "1.70"
exclude = [
    ".github/",
    "benchmarks/",
    "jmesh-benchmark-suite/",
]

[[bin]]
name = "jmesh"
path = "src/bin/cli.rs"

[features]
default = ["bundled", "fts5", "json1", "csv"]
bundled = ["rusqlite/bundled"]
fts5 = ["rusqlite/backup"]
json1 = []
csv = ["dep:csv"]
parquet = ["dep:parquet", "dep:arrow", "dep:bytes"]

[dependencies]
rusqlite = { version = "0.32", features = ["bundled", "backup", "extra_check"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
thiserror = "1.0"
clap = { version = "4.5", features = ["derive", "cargo"] }
anyhow = "1.0"
csv = { version = "1.3", optional = true }
parquet = { version = "53", optional = true }
arrow = { version = "53", optional = true }
bytes = { version = "1", optional = true }
tracing = { version = "0.1", optional = true }

[dev-dependencies]
tempfile = "3.10"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "throughput"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.bench]
opt-level = 3
lto = true
codegen-units = 1
