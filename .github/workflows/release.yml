name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Gate: the tag must match Cargo.toml and the crate must package cleanly
  # before we build anything or publish.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Check tag matches Cargo.toml version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag does not match Cargo.toml version $pkg"
            exit 1
          fi

      - name: Check crate packages cleanly
        run: cargo publish --dry-run

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux: glibc build for Ubuntu/Debian/Fedora, plus a fully static
          # musl build that runs on any distro (Alpine, old glibc, containers).
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          # macOS: Apple Silicon native, Intel cross-compiled via Xcode clang.
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          # Windows.
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl toolchain
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build CLI
        run: cargo build --release --bin jmesh --target ${{ matrix.target }}

      - name: Smoke test
        # Cross-built Intel-mac binary can't run on the Apple Silicon runner
        # without Rosetta; musl static binaries run fine on the glibc host.
        if: matrix.target != 'x86_64-apple-darwin'
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./target/${{ matrix.target }}/release/jmesh.exe --version
          else
            ./target/${{ matrix.target }}/release/jmesh --version
          fi

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          tag="$GITHUB_REF_NAME"
          target="${{ matrix.target }}"
          strip "target/$target/release/jmesh" || true
          mkdir -p dist
          cp "target/$target/release/jmesh" LICENSE README.md dist/
          tar -czf "jmesh-$tag-$target.tar.gz" -C dist jmesh LICENSE README.md
          shasum -a 256 "jmesh-$tag-$target.tar.gz" > "jmesh-$tag-$target.tar.gz.sha256"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tag = "$env:GITHUB_REF_NAME"
          $target = "${{ matrix.target }}"
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item "target/$target/release/jmesh.exe" dist/
          Copy-Item LICENSE, README.md dist/
          Compress-Archive -Path dist/* -DestinationPath "jmesh-$tag-$target.zip"
          $hash = (Get-FileHash "jmesh-$tag-$target.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  jmesh-$tag-$target.zip" | Out-File -Encoding ascii "jmesh-$tag-$target.zip.sha256"

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            jmesh-*.tar.gz
            jmesh-*.tar.gz.sha256
            jmesh-*.zip
            jmesh-*.zip.sha256
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish to crates.io
        run: cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
