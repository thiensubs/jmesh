name: Benchmark

on:
  push:
    branches: [main]
    paths-ignore:
      - 'benchmarks/**'
      - '**.md'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'benchmarks/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/benchmark.yml'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  benchmark:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev imagemagick libmagickwand-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: false

      - name: Install Ruby gems (charts; optional)
        run: gem install gruff || echo "gruff install failed — charts will be skipped"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Set up Python environment
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install sqlite-utils

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: benchmark-${{ runner.os }}

      - name: Build jmesh
        run: cargo build --release

      - name: Run benchmarks and generate report
        run: |
          source .venv/bin/activate
          cd jmesh-benchmark-suite
          ruby run.rb

      - name: Generate benchmark summary
        run: |
          echo "## 🏁 jmesh Benchmark Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          ruby -e '
            require "json"

            RESULTS_DIR = "jmesh-benchmark-suite/results"
            LANGS = %w[c rust python]

            data = {}
            LANGS.each do |lang|
              path = File.join(RESULTS_DIR, "#{lang}.json")
              next unless File.exist?(path)
              raw = JSON.parse(File.read(path))
              # Handle both: [{"name":"...", "time_ms":1.2}]  and  {"benchmarks":[...]}
              data[lang] = raw.is_a?(Array) ? raw : (raw["benchmarks"] || [])
            end

            # Build lookup: { benchmark_name => { "c" => time, "rust" => time, "python" => time } }
            by_bench = {}
            data.each do |lang, benches|
              benches.each do |b|
                # Defensive: try common key names
                name = b["name"] || b["benchmark"] || b["test"] || "unknown"
                time = b["time_ms"] || b["time"] || b["duration_ms"] || b["elapsed_ms"] || b["ms"] || 0
                time = time.to_f
                by_bench[name] ||= {}
                by_bench[name][lang] = time
              end
            end

            puts "| Benchmark | C (ms) | Rust (ms) | Python (ms) | Rust vs C | Python vs C |"
            puts "|-----------|--------|-----------|-------------|-----------|-------------|"

            by_bench.each do |name, times|
              c_time   = times["c"]   || 0
              rust_time = times["rust"] || 0
              py_time  = times["python"] || 0

              rust_vs = c_time > 0 ? "#{(rust_time / c_time * 100).round(1)}%" : "—"
              py_vs   = c_time > 0 ? "#{(py_time / c_time * 100).round(1)}%" : "—"

              puts "| #{name} | #{c_time} | #{rust_time} | #{py_time} | #{rust_vs} | #{py_vs} |"
            end
          ' >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${GITHUB_SHA::7}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "<details><summary>📎 Full BENCHMARK_REPORT.md</summary>" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cat jmesh-benchmark-suite/BENCHMARK_REPORT.md >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "</details>" >> $GITHUB_STEP_SUMMARY

      - name: Commit results
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config --local user.email "benchmark-bot@jmesh.thiensubs"
          git config --local user.name "Benchmark Bot"
          mkdir -p benchmarks
          cp jmesh-benchmark-suite/results/*.json benchmarks/
          cp jmesh-benchmark-suite/BENCHMARK_REPORT.md benchmarks/
          cp jmesh-benchmark-suite/report/*.png benchmarks/ 2>/dev/null || true
          echo "Last run: $(date -u +%Y-%m-%d\ %H:%M:%S\ UTC)" > benchmarks/LAST_RUN.txt
          echo "Commit: ${{ github.sha }}" >> benchmarks/LAST_RUN.txt
          git add benchmarks/
          if ! git diff --staged --quiet; then
            git commit -m "📊 benchmark: update results [skip ci]" -m "Run for commit ${{ github.sha }}"
            git push
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results-${{ github.run_id }}
          path: |
            jmesh-benchmark-suite/results/
            jmesh-benchmark-suite/BENCHMARK_REPORT.md
            jmesh-benchmark-suite/report/*.png
          if-no-files-found: warn
          retention-days: 30
